name: publish-ios

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the release (e.g. v0.2.0)"
        required: true
        type: string

concurrency:
  group: release-ios-${{ github.event.inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-ios:
    permissions:
      contents: write
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-targets: true

      - name: install iOS targets
        run: rustup target add aarch64-apple-ios x86_64-apple-ios aarch64-apple-ios-sim

      - name: cache ios build
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/CocoaPods
            ~/Library/Developer/Xcode/Archives
          key: ios-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/package-lock.json') }}
          restore-keys: |
            ios-${{ runner.os }}-

      - name: install frontend dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: create xcodebuild wrapper
        run: |
          REAL_XCODEBUILD="$(xcrun --find xcodebuild)"
          mkdir -p "$HOME/.bin"
          cat > "$HOME/.bin/xcodebuild" << EOF
          #!/bin/bash
          REAL="$REAL_XCODEBUILD"

          # pass version/info queries straight through untouched
          for arg in "\$@"; do
            if [[ "\$arg" == "-version" || "\$arg" == "-showsdks" || "\$arg" == "-list" ]]; then
              exec "\$REAL" "\$@"
            fi
          done

          for arg in "\$@"; do
            if [[ "\$arg" == "-exportArchive" ]]; then
              echo "Skipping exportArchive"
              exit 0
            fi
          done

          ARGS=()
          for arg in "\$@"; do
            if [[ "\$arg" != "-allowProvisioningUpdates" ]]; then
              ARGS+=("\$arg")
            fi
          done

          ARGS+=(
            "CODE_SIGNING_ALLOWED=NO"
            "CODE_SIGNING_REQUIRED=NO"
            "CODE_SIGN_IDENTITY="
            "DEVELOPMENT_TEAM=XXXXXXXXXX"
          )

          exec "\$REAL" "\${ARGS[@]}"
          EOF

          chmod +x "$HOME/.bin/xcodebuild"
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: init iOS project
        run: npm run tauri ios init
        env:
          APPLE_DEVELOPMENT_TEAM: XXXXXXXXXX

      - name: build iOS app
        run: npm run tauri ios build -- --export-method debugging
        env:
          APPLE_DEVELOPMENT_TEAM: XXXXXXXXXX

      - name: package IPA manually
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Urayomi.app" -path "*/Build/Products/release-iphoneos/*" | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Urayomi.ipa Payload

      - name: upload iOS IPA to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: Urayomi.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
